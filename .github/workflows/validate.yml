name: Validate dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/net-worth-parsers.mjs
          node --check scripts/net-worth-ingest.mjs
      - name: Test financial statement parsers
        run: node --test tests/net-worth-parsers.test.mjs
      - name: Validate manifest and required files
        run: |
          python - <<'PY'
          import json, pathlib, re
          required = ["index.html","app.js","styles.css","manifest.webmanifest","sw.js","icon.svg"]
          for name in required:
              assert pathlib.Path(name).is_file(), f"missing {name}"
          json.loads(pathlib.Path("manifest.webmanifest").read_text())
          html = pathlib.Path("index.html").read_text()
          assert 'type="password"' in html
          assert "DASHBOARD_TOKEN" not in html
          assert "sb_secret_" not in pathlib.Path("app.js").read_text()
          assert "GOOGLE_CLIENT_SECRET" not in pathlib.Path("app.js").read_text()
          print("dashboard static checks passed")
          PY
      - name: Verify no obvious private credentials are committed
        run: |
          if grep -R -E "sb_secret_[A-Za-z0-9_-]{10,}|GOOGLE_REFRESH_TOKEN=|BROKER_PDF_PASSWORD=" --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential private credential found"
            exit 1
          fi
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright UI verification
        run: |
          python3 -m http.server 4173 >/tmp/money-os-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm test
      - name: Upload Playwright verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-verification
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
