name: Validate dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate manifest and required files
        run: |
          python - <<'PY'
          import json, pathlib, re
          required = ["index.html","app.js","styles.css","manifest.webmanifest","sw.js","icon.svg"]
          for name in required:
              assert pathlib.Path(name).is_file(), f"missing {name}"
          json.loads(pathlib.Path("manifest.webmanifest").read_text())
          html = pathlib.Path("index.html").read_text()
          assert 'type="password"' in html
          assert "DASHBOARD_TOKEN" not in html
          assert "sb_secret_" not in pathlib.Path("app.js").read_text()
          assert "GOOGLE_CLIENT_SECRET" not in pathlib.Path("app.js").read_text()
          print("dashboard static checks passed")
          PY
      - name: Verify no obvious private credentials are committed
        run: |
          if grep -R -E "sb_secret_[A-Za-z0-9_-]{10,}|GOOGLE_REFRESH_TOKEN=|BROKER_PDF_PASSWORD=" --exclude-dir=.git .; then
            echo "Potential private credential found"
            exit 1
          fi
